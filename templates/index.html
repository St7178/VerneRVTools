<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard RVTools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container">
        <h1 class="text-center mb-4">Analizador de RVTools</h1>

        <form action="/upload" method="post" enctype="multipart/form-data" class="card p-4 shadow mb-3">
            <h5>Subir archivo Excel</h5>
            <input type="file" class="form-control mb-3" name="file" accept=".xlsx" required>
            <button type="submit" class="btn btn-primary w-100">Generar reporte</button>
        </form>

        <form action="/ruta" method="post" class="card p-4 shadow">
            <h5>O ingresar ruta del archivo</h5>
            <input type="text" class="form-control mb-3" name="ruta" placeholder="/ruta/al/archivo.xlsx">
            <button type="submit" class="btn btn-secondary w-100">Generar reporte</button>
        </form>
    </div>
</body>
</html>
